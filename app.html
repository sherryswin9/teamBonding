<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Team Bonding Fund</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand">💙 Team Bonding Fund</div>
    <div style="display:flex; align-items:center; gap:12px;">
      <span class="team-info" id="team-info">—</span>
      <button id="switch-team-btn">切換組別</button>
    </div>
  </div>

  <div class="page">
    <div class="tabs">
      <button class="tab-btn active" data-tab="dashboard">總覽</button>
      <button class="tab-btn" data-tab="members">組員管理</button>
      <button class="tab-btn" data-tab="quota">額度設定</button>
      <button class="tab-btn" data-tab="usage">使用紀錄</button>
    </div>

    <!-- 總覽 -->
    <div class="tab-panel active" id="panel-dashboard">
      <div class="card">
        <div class="row" style="justify-content: space-between;">
          <h2 style="margin:0;">團隊總覽</h2>
          <div class="field" style="margin:0;">
            <select id="dashboard-month"></select>
          </div>
        </div>
        <div class="grid-summary" id="team-summary"></div>
      </div>

      <div class="card">
        <h3>各組員本月狀況</h3>
        <table>
          <thead>
            <tr>
              <th>組員</th>
              <th>本月配額</th>
              <th>上月結轉</th>
              <th>本月可用</th>
              <th>本月已用</th>
              <th>本月結餘（可帶至下月）</th>
            </tr>
          </thead>
          <tbody id="member-rows"></tbody>
        </table>
      </div>
    </div>

    <!-- 組員管理 -->
    <div class="tab-panel" id="panel-members">
      <div class="card">
        <h2>新增組員</h2>
        <div class="row">
          <input id="new-member-name" placeholder="組員姓名" style="flex:1" />
          <button id="add-member-btn">新增</button>
        </div>
        <div class="error-text" id="member-error"></div>
      </div>
      <div class="card">
        <h3>組員名單（<span id="member-count">0</span> 人）</h3>
        <table>
          <thead><tr><th>姓名</th><th>狀態</th><th>加入時間</th><th></th></tr></thead>
          <tbody id="members-list"></tbody>
        </table>
      </div>
    </div>

    <!-- 額度設定 -->
    <div class="tab-panel" id="panel-quota">
      <div class="card">
        <h2>設定每月固定額度（每人）</h2>
        <div class="row">
          <div class="field">
            <label for="quota-month">生效月份</label>
            <input type="month" id="quota-month" />
          </div>
          <div class="field">
            <label for="quota-amount">每人每月額度</label>
            <input type="number" id="quota-amount" min="0" step="1" placeholder="500" />
          </div>
          <button id="save-quota-btn">儲存</button>
        </div>
        <p class="muted">設定後，該月份「起」的每月額度都會套用這個數字，直到有新的設定覆蓋為止。</p>
        <div class="error-text" id="quota-error"></div>
      </div>
      <div class="card">
        <h3>額度歷史</h3>
        <table>
          <thead><tr><th>生效月份</th><th>每人每月額度</th></tr></thead>
          <tbody id="quota-history"></tbody>
        </table>
      </div>
    </div>

    <!-- 使用紀錄 -->
    <div class="tab-panel" id="panel-usage">
      <div class="card">
        <h2>新增使用紀錄</h2>
        <div class="field" style="max-width:200px;">
          <label for="usage-month">月份（套用到下面每一列）</label>
          <input type="month" id="usage-month" />
        </div>

        <table>
          <thead><tr><th>組員</th><th>金額</th><th>備註</th><th></th></tr></thead>
          <tbody id="usage-rows"></tbody>
        </table>

        <div class="row" style="margin-top:12px;">
          <button class="secondary" id="add-usage-row-btn">+ 新增一列</button>
          <button id="submit-usage-rows-btn">全部送出</button>
        </div>
        <p class="muted" style="margin-top:8px;">組員選「👥 全部組員」時可以選：整筆金額平均分攤給每個人，或是每個人都各記一筆同樣的金額。</p>
        <div class="error-text" id="usage-error"></div>
      </div>
      <div class="card">
        <h3>紀錄列表</h3>
        <table>
          <thead><tr><th>月份</th><th>組員</th><th>金額</th><th>備註</th><th></th></tr></thead>
          <tbody id="usage-list"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
