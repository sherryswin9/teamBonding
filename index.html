<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Team Bonding Fund — 進入組別</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="center-box">
    <div class="card auth-card">
      <div class="row" style="justify-content:flex-end; margin-bottom:8px;">
        <div class="lang-switcher">
          <button class="lang-btn" data-lang="zh">中文</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
      </div>

      <h2>Team Bonding Fund</h2>
      <p class="muted" data-i18n="tagline">團隊活動基金管理小工具</p>

      <div class="field">
        <label for="join-code" data-i18n="joinLabel">輸入組別代碼</label>
        <div class="row">
          <input id="join-code" placeholder="例如 abc123" data-i18n-placeholder="joinPlaceholder" style="flex:1" />
          <button id="join-btn" data-i18n="joinBtn">進入</button>
        </div>
        <div class="error-text" id="join-error"></div>
      </div>

      <div class="divider" data-i18n="orDivider">— 或 —</div>

      <div class="field">
        <label for="new-team-code" data-i18n="createLabel">建立新組別（自訂代碼）</label>
        <div class="row">
          <input id="new-team-code" placeholder="例如 my-team（英文/數字/-，好記就好）" data-i18n-placeholder="createPlaceholder" style="flex:1" />
          <button id="create-btn" class="secondary" data-i18n="createBtn">建立</button>
        </div>
        <p class="muted" style="margin:4px 0 0;" data-i18n="createHint">這組代碼之後就是組別名稱，組員靠它加入，記得分享給大家。</p>
        <div class="error-text" id="create-error"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/i18n.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/team-select.js"></script>
</body>
</html>
